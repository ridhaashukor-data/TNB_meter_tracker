[platformio]
extra_configs = secrets.local.ini

[secrets]
wifi_ssid =
wifi_pass =
script_url =
device_token =
ota_host = tnb-meter-tracker
ota_password =
ota_ip = tnb-meter-tracker.local

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -D WIFI_SSID=\"${secrets.wifi_ssid}\"
    -D WIFI_PASS=\"${secrets.wifi_pass}\"
    -D SCRIPT_URL=\"${secrets.script_url}\"
    -D DEVICE_TOKEN=\"${secrets.device_token}\"
    -D ENABLE_OTA=1
    -D OTA_HOSTNAME=\"${secrets.ota_host}\"
    -D OTA_PASSWORD=\"${secrets.ota_password}\"
    -D PULSE_LOCKOUT_MS=120
lib_deps =
    bblanchon/ArduinoJson@^7

[env:esp32ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = ${secrets.ota_ip}
upload_flags =
    --auth=${secrets.ota_password}
